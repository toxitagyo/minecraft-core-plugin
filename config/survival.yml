# Configuration du Module Survie

# Système de soif
thirst:
  enabled: true
  max-thirst: 100
  depletion-rate: 0.5  # points par tick
  thirst-from-drinking: 10
  damage-when-empty: true
  damage-amount: 1  # demi-cœur par tick

# Gestion de la température
temperature:
  enabled: true
  default-temperature: 20
  
  # Impact des biomes
  biome-effects:
    desert: 35
    jungle: 28
    taiga: 5
    snowy_taiga: -15
    frozen_ocean: -20
    deep_frozen_ocean: -30
    nether: 50
  
  # Dégâts
  cold-damage: 1  # demi-cœur
  cold-threshold: 0
  hot-damage: 0.5
  hot-threshold: 40

# Difficulté adaptative
dynamic-difficulty:
  enabled: true
  scale-by-time: true
  scale-by-distance: true
  
  difficulty-levels:
    level-1:
      health-multiplier: 1.0
      damage-multiplier: 1.0
      spawn-rate-multiplier: 1.0
    level-5:
      health-multiplier: 2.0
      damage-multiplier: 1.5
      spawn-rate-multiplier: 1.5

# Blood Moon (Lune de Sang)
blood-moon:
  enabled: true
  frequency-days: 7
  duration-minutes: 15
  
  effects:
    mob-spawn-multiplier: 2.0
    mob-damage-multiplier: 1.3
    mob-health-multiplier: 1.5
    block-sleep: true
    custom-sky-color: true
    sky-color-rgb: "#8B0000"
