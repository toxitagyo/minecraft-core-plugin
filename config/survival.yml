# Configuration du Module Survie - Minecraft 1.26.2

# Système de soif
thirst:
  enabled: true
  max-thirst: 100
  depletion-rate: 0.5  # points par tick
  thirst-from-drinking: 10
  damage-when-empty: true
  damage-amount: 1  # demi-cœur par tick
  
  # Hydratation automatique
  water-hydration: 25
  rain-hydration: 5

# Gestion de la température
temperature:
  enabled: true
  default-temperature: 20
  
  # Impact des biomes (1.26.2)
  biome-effects:
    desert: 35
    badlands: 32
    jungle: 28
    bamboo_jungle: 26
    taiga: 5
    snowy_taiga: -15
    frozen_ocean: -20
    deep_frozen_ocean: -30
    nether: 50
    crimson_forest: 48
    warped_forest: 45
    soul_sand_valley: 52
    basalt_deltas: 50
  
  # Dégâts
  cold-damage: 1  # demi-cœur
  cold-threshold: 0
  hot-damage: 0.5
  hot-threshold: 40
  
  # Armures - effet de température
  armor-effects:
    leather: 0.5
    iron: 0.8
    diamond: 1.2
    netherite: 1.5

# Difficulté adaptative
dynamic-difficulty:
  enabled: true
  scale-by-time: true
  scale-by-distance: true
  
  difficulty-levels:
    level-1:
      health-multiplier: 1.0
      damage-multiplier: 1.0
      spawn-rate-multiplier: 1.0
    level-5:
      health-multiplier: 2.0
      damage-multiplier: 1.5
      spawn-rate-multiplier: 1.5
    level-10:
      health-multiplier: 3.5
      damage-multiplier: 2.5
      spawn-rate-multiplier: 2.5

# Blood Moon (Lune de Sang)
blood-moon:
  enabled: true
  frequency-days: 7
  duration-minutes: 15
  
  effects:
    mob-spawn-multiplier: 2.0
    mob-damage-multiplier: 1.3
    mob-health-multiplier: 1.5
    block-sleep: true
    custom-sky-color: true
    sky-color-rgb: "#8B0000"
    special-mobs: true  # 1.26.2 feature

# Version Minecraft
version-support: "1.26.2"
