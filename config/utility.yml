# Configuration du Module Utilitaires - Minecraft 1.26.2

# Ender Storage (Stockage Ender)
ender-storage:
  enabled: true
  color-coded: true
  
  # Configuration des couleurs (3 bandes)
  colors:
    - "white"
    - "orange"
    - "magenta"
    - "light-blue"
    - "yellow"
    - "lime"
    - "pink"
    - "gray"
    - "light-gray"
    - "cyan"
    - "purple"
    - "blue"
    - "brown"
    - "green"
    - "red"
    - "black"
  
  # Configuration des Ender Pouches
  pouch:
    crafting-recipe: true
    materials:
      - "leather"
      - "ender-pearl"
      - "obsidian"
  
  lock-system:
    enabled: true
    lock-item: "diamond"

# Chunk Loader - Now as craftable item
chunk-loader:
  enabled: true
  
  # Item craftable: Obsidian + Ender Pearl + Diamond
  crafting:
    enabled: true
    material: "obsidian"
    recipe-shape:
      - "OEO"
      - "EDE"
      - "OEO"
    ingredients:
      O: "obsidian"
      E: "ender_pearl"
      D: "diamond"
  
  limits:
    max-per-player: 5
    max-per-world: 100
  
  features:
    auto-disable-offline: true
    offline-timeout-hours: 24
    chunk-loading-radius: 1  # chunks autour du loader
  
  forbidden-worlds:
    - "nether"
    - "the_end"

# Ender Chest - Now as craftable item
ender-chest:
  enabled: true
  
  # Item craftable: Obsidian + Eye of Ender + Ender Pearl
  crafting:
    enabled: true
    material: "ender_chest"
    recipe-shape:
      - "OBO"
      - "BEB"
      - "OBO"
    ingredients:
      O: "obsidian"
      B: "ender_eye"
      E: "ender_pearl"
  
  features:
    access-anywhere: true
    shared-storage: false
    capacity-slots: 27
    color-coded: true

# Amélioration du Sommeil
improved-sleeping:
  enabled: true
  percentage-required: 30  # % de joueurs pour passer la nuit
  
  features:
    phantom-spawn: true
    weather-skip: true
    time-skip: true
    messages-enabled: true

# Système de Réanimation des Joueurs
player-revive:
  enabled: true
  
  bleed-out:
    enabled: true
    duration-seconds: 30
    show-bar: true
  
  revive:
    items-required:
      - "golden_apple"
      - "red_stained_glass_bottle"
    revive-time-seconds: 3
    restore-health: 5  # demi-cœurs
  
  penalties:
    hunger-on-revive: 5
    slowness-duration: 60  # ticks
    weakness-duration: 120

# Configuration de crafting générale
crafting:
  ender-chest:
    enabled: true
    discover-on-craft: true
  chunk-loader:
    enabled: true
    discover-on-craft: true
