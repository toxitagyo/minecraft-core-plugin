# Configuration du Module Social - Minecraft 1.26.2

# Gestion des équipes
teams:
  max-members: 10
  auto-create-on-join: true
  default-team: "Neutre"
  colors:
    Red: "§c"
    Blue: "§9"
    Green: "§a"
    Yellow: "§e"
    Purple: "§d"
    Cyan: "§b"

# Gestion des parties (Party)
party:
  enabled: true
  max-members: 5
  friendly-fire: false
  invite-timeout: 60  # en secondes
  team-bonus-multiplier: 1.2

# Quêtes coopératives
quests:
  enabled: true
  difficulty-scaling: true
  reward-multiplier: 1.0
  group-bonus: 1.5

# Chat d'équipe
chat:
  team-chat-enabled: true
  team-chat-prefix: "[TEAM]"
  party-chat-prefix: "[PARTY]"
  global-chat-enabled: true

# Version Minecraft
version-support: "1.26.2"
